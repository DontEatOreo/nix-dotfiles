---
- name: Build and verify repo-local smoke-test tools
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Detect the platform and define shared paths
      ansible.builtin.import_role:
        name: platform
      tags:
        - always

    - name: Install the repository Python tool
      ansible.builtin.include_role:
        name: bootstrap
        tasks_from: python-tool
        apply:
          tags:
            - python
      tags:
        - python

    - name: Link Python command aliases
      ansible.builtin.include_role:
        name: tools
        tasks_from: python
        apply:
          tags:
            - python
      tags:
        - python

    - name: Install upstream script tools
      ansible.builtin.include_role:
        name: tools
        tasks_from: upstream
        apply:
          tags:
            - upstream
      tags:
        - upstream

    - name: Verify every installed smoke-test tool
      ansible.builtin.include_role:
        name: tools
        tasks_from: verify
        apply:
          tags:
            - verify
      vars:
        tools_homebrew_prefix: "{{ dotfiles_home_dir }}/.local"
      tags:
        - verify
