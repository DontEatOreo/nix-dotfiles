---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
version: 2
base:
  image:
    registry: ghcr.io
    repository: projectbluefin/bluefin-nvidia
    tag: stable
    digest: sha256:8e1376cf17f9d8a47e35bc22dbb80c14f66018cb8d857f236db03b4958bdcbdb
metadata:
  name: spectrum
  description: Evy's Bluefin workstation image
  labels:
    org.opencontainers.image.source: https://github.com/4evy/dotfiles
spec:
  platforms:
    - linux/amd64
  tool-versions:
    # Keep this aligned with the bluebuild-cli npins revision. Unlike tagged
    # release installers, commit installers include the recipe-v2 feature.
    bluebuild: 84f8726bcb44a0d0e79f5768e311ed7184ad8b3f

stages:
  # BlueBuild currently resolves imports from the repository-level recipes/
  # directory, not from the directory containing this recipe.
  - from-file: ../bluebuild/recipes/spectrum/stages/python-runtime.yml
  - from-file: ../bluebuild/recipes/spectrum/stages/ghostty.yml

modules:
  # Put immutable, remote-heavy work first. Local source and configuration
  # changes then invalidate only the cheap assembly/finalization tail.
  - from-file: ../bluebuild/recipes/spectrum/modules/software.yml
  - from-file: ../bluebuild/recipes/spectrum/modules/local.yml
  - from-file: ../bluebuild/recipes/spectrum/modules/system.yml
  - from-file: ../bluebuild/recipes/spectrum/modules/validate.yml
