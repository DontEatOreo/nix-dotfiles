---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v2.json
version: 2
base:
  image:
    registry: ghcr.io
    repository: projectbluefin/bluefin-nvidia
    tag: stable
    digest: sha256:8e1376cf17f9d8a47e35bc22dbb80c14f66018cb8d857f236db03b4958bdcbdb
metadata:
  name: spectrum
  description: Evy's Bluefin workstation image
  labels:
    org.opencontainers.image.source: https://github.com/4evy/dotfiles
spec:
  platforms:
    - linux/amd64
  tool-versions:
    bluebuild: none

stages:
  - name: python-runtime
    from: registry.fedoraproject.org/fedora:45@sha256:880a6f885db64973f88e01289baa74e3854506afaafdb8d705d18f408bddaa56
    modules:
      - type: copy@v1
        src: npins/sources.json
        dest: /src/npins/sources.json
      - type: dnf@v1
        source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
        install:
          install-weak-deps: false
          packages:
            - python3
      - type: script@v1
        source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
        snippets:
          - |
            python3 - <<'PYTHON'
            import base64
            import hashlib
            import json
            import shutil
            import tarfile
            import tempfile
            import urllib.request
            from pathlib import Path

            pin = json.loads(Path("/src/npins/sources.json").read_text())["pins"]["python_astral"]
            with tempfile.TemporaryDirectory() as temporary_directory:
                temporary_path = Path(temporary_directory)
                archive = temporary_path / "astral.tar.gz"
                urllib.request.urlretrieve(pin["url"], archive)

                algorithm, expected_digest = pin["hash"].split("-", maxsplit=1)
                if algorithm != "sha256":
                    raise ValueError(f"unsupported Astral hash algorithm: {algorithm}")
                actual_digest = base64.b64encode(
                    hashlib.sha256(archive.read_bytes()).digest()
                ).decode()
                if actual_digest != expected_digest:
                    raise ValueError("Astral source archive checksum mismatch")

                with tarfile.open(archive) as source_archive:
                    source_archive.extractall(temporary_path, filter="data")
                source = temporary_path / f"astral-{pin['version']}" / "src" / "astral"
                destination = Path("/out/usr/lib/dotfiles/python/astral")
                destination.parent.mkdir(parents=True, exist_ok=True)
                shutil.copytree(source, destination)
                (destination.parent / ".astral-version").write_text(f"{pin['version']}\n")
            PYTHON

  - name: ghostty
    from: registry.fedoraproject.org/fedora:45@sha256:880a6f885db64973f88e01289baa74e3854506afaafdb8d705d18f408bddaa56
    modules:
      - type: copy@v1
        src: npins/sources.json
        dest: /src/npins/sources.json
      - type: copy@v1
        src: packages/ghostty-patched/patches
        dest: /src/packages/ghostty-patched/patches
      - type: copy@v1
        src: packages/ghostty-patched/build.sh
        dest: /src/build-ghostty.sh
      - type: dnf@v1
        source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
        install:
          install-weak-deps: false
          packages:
            - blueprint-compiler
            - dbus-devel
            - fontconfig-devel
            - freetype-devel
            - gcc
            - gcc-c++
            - gettext
            - git
            - gtk4-devel
            - gtk4-layer-shell-devel
            - jq
            - libadwaita-devel
            - libdrm-devel
            - libglvnd-devel
            - libxkbcommon-devel
            - libxml2-devel
            - mesa-libgbm-devel
            - ncurses-devel
            - openssl
            - pango-devel
            - patch
            - pkgconf-pkg-config
            - tar
            - xz
      - type: script@v1
        source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
        env:
          SOURCE_LOCK: /src/npins/sources.json
          SOURCE_PIN: ghostty_archive
          REVISION_PIN: ghostty
          ZIG_PIN: ghostty_zig_x86_64_linux
          PATCHES: /src/packages/ghostty-patched/patches
          PREFIX: /out/usr
          ARTIFACT: /out/usr/bin/ghostty
          VERSION_PREFIX: 1.3.2-dev
          BUILD_ARGUMENTS: >-
            -j1
            -Dcpu=baseline
            -Doptimize=ReleaseFast
            -Demit-test-exe=false
        snippets:
          - bash /src/build-ghostty.sh

modules:
  - type: copy@v1
    from: python-runtime
    src: /out/usr
    dest: /usr

  - type: copy@v1
    from: ghostty
    src: /out/usr
    dest: /usr

  - type: copy@v1
    src: bluebuild/files/system
    dest: /

  - type: bling@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    install:
      - 1password

  - type: copy@v1
    src: bluebuild/files/dnf/vscode.repo
    dest: /etc/yum.repos.d/vscode.repo

  - type: dnf@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    repos:
      cleanup: true
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      nonfree: rpmfusion
    install:
      install-weak-deps: false
      packages:
        - blueprint-compiler
        - bootc
        - bubblewrap
        - code
        - curl
        - file
        - findutils
        - fuse3
        - git
        - google-noto-color-emoji-fonts
        - google-noto-emoji-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-mono-cjk-vf-fonts
        - google-noto-sans-mono-vf-fonts
        - google-noto-sans-symbols-2-fonts
        - google-noto-sans-symbols-vf-fonts
        - google-noto-sans-vf-fonts
        - gsound
        - gtk4-layer-shell
        - just
        - kmscon
        - kmscon-freetype
        - libgda
        - libgda-sqlite
        - liberation-mono-fonts
        - liberation-sans-fonts
        - liberation-serif-fonts
        - libxdo
        - ncurses
        - opensc
        - openssh-clients
        - pinentry
        - pinentry-gnome3
        - pipewire-gstreamer
        - podman
        - podman-compose
        - procps-ng
        - python3
        - rsync
        - selinux-policy-devel
        - solaar
        - systemd-oomd-defaults
        - tailscale
        - telegram-desktop
        - uresourced
        - vim-enhanced
        - vulkan-tools
        - xdg-desktop-portal
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        # renovate: datasource=github-releases depName=getsops/sops
        - https://github.com/getsops/sops/releases/download/v3.13.3/sops-3.13.3-1.x86_64.rpm
        # renovate: datasource=github-releases depName=rustdesk/rustdesk
        - https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-0.x86_64.rpm
        - https://discord.com/api/download?platform=linux&format=rpm

  - type: gnome-extensions@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    install:
      - 8834 # Copyous

  - type: kargs@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    kargs:
      - plymouth.enable=0
      - rd.plymouth=0
      - systemd.show_status=1
      - rd.systemd.show_status=1
      - loglevel=7

  - type: systemd@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    system:
      enabled:
        - fedora-atomic-desktop-appstream-cache-refresh.timer
        - pcscd.socket
        - podman.socket
        - rustdesk.service
        - systemd-oomd.service
        - systemd-oomd.socket
        - tailscaled.service
        - uresourced.service
      disabled:
        - bootc-unified-storage.service
        - fedora-atomic-desktop-appstream-cache-refresh.service

  - type: script@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    snippets:
      - install -d -m 0755 /nix /var/roothome
      - touch /nix/.spectrum-mountpoint
      - |
        if authselect is-feature-enabled with-fingerprint >/dev/null 2>&1; then
          authselect disable-feature with-fingerprint
        fi
      - rm -rf -- /boot/efi
      - rm -rf -- /run/selinux-policy /run/setrans
      - rm -f -- /etc/yum.repos.d/vscode.repo
      - |
        for directory in /run/rpm-ostree/lock /run/rpm-ostree /run/dnf; do
          if test -d "$directory"; then
            rmdir "$directory"
          fi
        done
      - test "$(systemctl is-enabled bootc-unified-storage.service 2>/dev/null || true)" = disabled
      - >-
        PYTHONPATH=/usr/lib/dotfiles/python /usr/bin/python3.14 -c
        'import astral, pathlib;
        assert astral.__version__ ==
        pathlib.Path("/usr/lib/dotfiles/python/.astral-version").read_text().strip()'
      - rpm -q kmscon kmscon-freetype
      - test -f /usr/lib64/kmscon/mod-freetype.so
      - bootc container lint
