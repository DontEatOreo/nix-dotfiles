---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # Keep assertions last so every completed image layer is verified together.
  - type: script@v1
    source: ghcr.io/blue-build/modules@sha256:c5ed99f07b15c8d575a4fa64a77e5cd5602b00da4c84379f5675db2ae4757061
    snippets:
      - test "$(systemctl is-enabled bootc-unified-storage.service 2>/dev/null || true)" = disabled
      - test ! -e /usr/etc/profile.d/umotd.sh
      - test ! -e /etc/profile.d/umotd.sh
      - >-
        PYTHONPATH=/usr/lib/dotfiles/python /usr/bin/python3.14 -c
        'import astral, pathlib;
        assert astral.__version__ ==
        pathlib.Path("/usr/lib/dotfiles/python/.astral-version").read_text().strip()'
      - rpm -q kmscon kmscon-freetype
      - test -f /usr/lib64/kmscon/mod-freetype.so
      - test -x /usr/libexec/dotfiles/kmscon/kmscon-theme-config.py
      - test -x /usr/libexec/dotfiles/kmscon/kmscon-refresh.py
      - test -f /usr/share/dotfiles/black_rose_doll_palette.json
      - test "$(systemctl is-enabled kmscon-theme-refresh.timer)" = enabled
      - test "$(systemctl is-enabled kmsconvt@.service)" = enabled
      - test "$(readlink /etc/systemd/system/autovt@.service)" = /usr/lib/systemd/system/kmsconvt@.service
      - test "$(readlink /etc/systemd/system/getty.target.wants/kmsconvt@tty1.service)" = /usr/lib/systemd/system/kmsconvt@.service
      - test -f /usr/lib/systemd/system/brew-setup.service
      - test -f /usr/share/fonts/url-fonts/NotoColorEmojiBitmap/NotoColorEmoji.ttf
      - >-
        fc-list ':charset=131A9-131AA' family |
        grep -Fq 'Noto Sans Egyptian Hieroglyphs'
      - test -f /usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/extension.js
      - test -f /usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/schemas/gschemas.compiled
      - test -f /usr/share/kwin/scripts/hyper-window-tiling/contents/code/main.js
      - test -f /usr/libexec/dotfiles/kanata/kanata.kbd
      - test -x /usr/bin/kanata
      - /usr/bin/kanata --version
      - test -f /usr/lib/udev/rules.d/70-dotfiles-uinput.rules
      - test -f /usr/lib/modules-load.d/uinput.conf
      - getent group uinput >/dev/null
      - test "$(systemctl is-enabled kanata-main.service)" = enabled
      - test "$(grep -Fx 'blacklist pcspkr' /etc/modprobe.d/disable-pc-speaker.conf)" = 'blacklist pcspkr'
      - test "$(grep -Fx 'Conflicts=kmsconvt@tty1.service' /usr/lib/systemd/system/gdm.service.d/60-spectrum-kmscon.conf)" = 'Conflicts=kmsconvt@tty1.service'
      - test "$(grep -Fx 'After=kmsconvt@tty1.service' /usr/lib/systemd/system/gdm.service.d/60-spectrum-kmscon.conf)" = 'After=kmsconvt@tty1.service'
      - systemd-analyze verify gdm.service kmsconvt@tty1.service
      - rm -f -- /run/systemd/systemd-units-load
      - bluebuild --version
      - bluebuild recipe --help >/dev/null
      - bootc container lint
