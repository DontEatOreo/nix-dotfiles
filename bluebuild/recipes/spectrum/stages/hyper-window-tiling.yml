---
# yaml-language-server: $schema=https://schema.blue-build.org/stage-v1.json
name: hyper-window-tiling
from: docker.io/oven/bun:1.3.14@sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
modules:
  - type: copy@v1
    src: packages/hyper-window-tiling/package.json
    dest: /src/package.json

  - type: copy@v1
    src: packages/hyper-window-tiling/bun.lock
    dest: /src/bun.lock

  - type: copy@v1
    src: packages/hyper-window-tiling/tsconfig.json
    dest: /src/tsconfig.json

  - type: copy@v1
    src: packages/hyper-window-tiling/src
    dest: /src/src

  - type: copy@v1
    src: packages/hyper-window-tiling/gnome
    dest: /src/gnome

  - type: copy@v1
    src: packages/hyper-window-tiling/kde
    dest: /src/kde

  - type: containerfile
    snippets:
      - |
        RUN \
          --mount=type=cache,id=spectrum-hyper-window-tiling-bun-v1,sharing=locked,target=/root/.bun/install/cache \
          cd /src && \
          bun install --frozen-lockfile && \
          bun run build && \
          install -D -m 0644 gnome/metadata.json /out/usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/metadata.json && \
          install -D -m 0644 dist/gnome/extension.js /out/usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/extension.js && \
          install -D -m 0644 gnome/schemas/org.gnome.shell.extensions.hyper-window-tiling.gschema.xml /out/usr/share/gnome-shell/extensions/hyper-window-tiling@4evy.local/schemas/org.gnome.shell.extensions.hyper-window-tiling.gschema.xml && \
          install -D -m 0644 kde/metadata.json /out/usr/share/kwin/scripts/hyper-window-tiling/metadata.json && \
          install -D -m 0644 dist/kde/contents/code/main.js /out/usr/share/kwin/scripts/hyper-window-tiling/contents/code/main.js
