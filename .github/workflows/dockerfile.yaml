name: Dockerfile Smoke

on:
  pull_request:
    branches:
      - master
    paths: &dockerfile-paths
      - .github/workflows/dockerfile.yaml
      - .ansible-lint
      - .dockerignore
      - .yamllint
      - Dockerfile
      - ansible.cfg
      - ansible/**
      - '!ansible/tests/**'
      - browser/**
      - compose.yaml
      - containers/**
      - dotfiles/**
      - npins/sources.json
      - packages/dotfiles-python/assets/**
      - packages/dotfiles-python/src/**
      - packages/terminal-theme-tools/build.zig
      - packages/terminal-theme-tools/build.zig.zon
      - packages/terminal-theme-tools/build_support.zig
      - packages/terminal-theme-tools/config/**
      - packages/terminal-theme-tools/include/**
      - packages/terminal-theme-tools/src/**
      - packages/terminal-theme-tools/tests/**
      - packages/terminal-theme-tools/vendor/**
      - pyproject.toml
      - uv.lock
  push:
    branches:
      - master
    paths: *dockerfile-paths
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read # needed to checkout repository contents

jobs:
  smoke:
    name: Build Smoke Image
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate Compose Model
        run: |
          docker compose config --quiet
          docker compose --profile shell config --quiet

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: true

      - name: Check Docker Build
        run: |
          docker buildx build \
            --check \
            --platform linux/amd64 \
            --target dotfiles-test \
            .

      - name: Build Cached Smoke Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: dotfiles-test
          platforms: linux/amd64
          pull: true
          load: true
          tags: dotfiles:fedora-test
          cache-from: type=gha,scope=dotfiles-fedora-smoke
          cache-to: type=gha,mode=max,scope=dotfiles-fedora-smoke,ignore-error=true

      - name: Validate Image
        run: docker run --rm dotfiles:fedora-test
