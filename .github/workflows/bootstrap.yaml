name: Bootstrap

on:
  pull_request:
    paths: &bootstrap-paths
      - .github/workflows/bootstrap.yaml
      - Justfile
      - ansible/bootstrap.sh
      - ansible/requirements.yml
      - ansible/tests/bootstrap-simulate.sh
      - ansible/tests/fixtures/bootstrap/**
      - ansible/tests/test_bootstrap.py
  push:
    branches:
      - master
    paths: *bootstrap-paths
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulation:
    name: Disposable host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Simulate Successful Bootstrap
        run: ansible/tests/bootstrap-simulate.sh

      - name: Verify Failure Propagation
        run: |
          set +e
          simulation_output="$(
            ansible/tests/bootstrap-simulate.sh apply-failure 2>&1
          )"
          simulation_exit_code="$?"
          set -e
          printf '%s\n' "${simulation_output}"
          test "${simulation_exit_code}" -eq 22
          ! grep -q -- '--tags host' <<<"${simulation_output}"
