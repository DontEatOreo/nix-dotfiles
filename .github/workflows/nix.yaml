name: Nix

on:
  pull_request:
    paths: &nix-paths
      # Workflow and repository-wide check configuration.
      - .github/actions/setup-nix/**
      - .github/workflows/nix.yaml
      - .ansible-lint
      - .clang-format
      - .gitignore
      - .markdownlint.json
      - .shellcheckrc
      - .yamllint
      - biome.jsonc
      - pyproject.toml

      # Inputs to the flake, NixOS configuration, and package checks that are
      # not already covered by the formatter/linter extensions below.
      - .dockerignore
      - Dockerfile
      - Justfile
      - '**/flake.lock'
      - '**/Containerfile'
      - ansible/roles/system/templates/macos/tailscale-ssh-helper.py.in
      - bluebuild/files/system/**
      - dotfiles/dot_config/autostart/1password.desktop
      - dotfiles/dot_config/fontconfig/conf.d/**
      - dotfiles/dot_config/kanata/kanata.kbd
      - dotfiles/dot_local/bin/executable_*
      - dotfiles/dot_quiltrc
      - packages/dotfiles-python/assets/**
      - packages/fido-phone/**
      - packages/hyper-window-tiling/bun.lock
      - packages/hyper-window-tiling/gnome/schemas/**
      - packages/*/patches/**
      - packages/terminal-theme-tools/**

      # `nix flake check` includes treefmt and pre-commit checks, so changes to
      # any file type checked by those tools are genuine inputs to this job.
      - '**/*.bash'
      - '**/*.c'
      - '**/*.cjs'
      - '**/*.css'
      - '**/*.h'
      - '**/*.js'
      - '**/*.json'
      - '**/*.jsonc'
      - '**/*.lua'
      - '**/*.md'
      - '**/*.mjs'
      - '**/*.nix'
      - '**/*.py'
      - '**/*.sh'
      - '**/*.toml'
      - '**/*.ts'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.zsh'
  push:
    branches:
      - master
    paths: *nix-paths
  workflow_dispatch: null

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read # needed to checkout repository contents

jobs:
  checks:
    name: Flake checks
    # Immutable GitHub bot IDs: Renovate, GitHub Actions, Dependabot.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (github.event.pull_request.user.type == 'Bot' &&
      contains(fromJSON('[29139614, 41898282, 49699333]'), github.event.pull_request.user.id))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set Up Nix
        uses: ./.github/actions/setup-nix
        with:
          cache-builds: "true"

      - name: Materialize Flake Partitions
        run: |
          nix store add-path nix/dev
          nix store add-path nix/nixos

      - name: Check Flake
        run: >-
          nix flake check
          --keep-going --no-build

      - name: Build Repository Checks
        run: >-
          nix build
          --keep-going --no-link --print-build-logs
          .#checks.x86_64-linux.pre-commit
          .#checks.x86_64-linux.treefmt

      - name: Check Quilt Queues
        run: nix develop --command just quilt-check

      - name: Detect Native Check Inputs
        id: native-inputs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- ':(exclude,glob)**/*.md'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # Build package/test checks when non-documentation inputs change while
      # leaving the full NixOS closure as an evaluation check. Keeping these
      # separate from repository linters avoids an hour-long build for docs.
      - name: Build Native Checks
        if: steps.native-inputs.outputs.build == 'true'
        run: >-
          nix build
          --keep-going --no-link --print-build-logs
          .#checks.x86_64-linux.dotfiles-python
          .#checks.x86_64-linux.equicord-settings
          .#checks.x86_64-linux.hyper-window-tiling
          .#checks.x86_64-linux.nixos-module
          .#checks.x86_64-linux.terminal-theme-tools
          .#checks.x86_64-linux.toshy-runtime
