name: Set Up Bun
description: Install the pinned Bun runtime and restore its dependency download cache.

inputs:
  cache-dependency-path:
    description: Newline-separated lockfile patterns used to invalidate the cache.
    required: true
  cache-scope:
    description: Stable namespace that prevents unrelated Bun projects sharing entries.
    required: true

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .tool-versions

    - name: Restore Bun Dependency Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: >-
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ inputs.cache-scope }}-${{
          hashFiles(inputs.cache-dependency-path) }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ inputs.cache-scope }}-
