name: Set Up Bun
description: Install the pinned Bun runtime and restore its dependency download cache.

inputs:
  cache-dependency-path:
    description: Newline-separated lockfile patterns used to invalidate the cache.
    required: true
  cache-scope:
    description: Stable namespace that prevents unrelated Bun projects sharing entries.
    required: true

runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .tool-versions

    - name: Restore Bun Dependency Cache
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: >-
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ inputs.cache-scope }}-${{
          hashFiles(inputs.cache-dependency-path) }}
        restore-prefixes-first-match: >-
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ inputs.cache-scope }}-
        nix: "false"
        paths: ~/.bun/install/cache
        save: ${{ github.event_name != 'pull_request' }}
        purge: ${{ github.event_name != 'pull_request' }}
        purge-prefixes: >-
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ inputs.cache-scope }}-
        purge-created: "0"
        purge-primary-key: never
