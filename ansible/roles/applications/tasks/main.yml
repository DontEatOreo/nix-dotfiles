---
- name: Install Visual Studio Code
  ansible.builtin.import_tasks: vscode.yml
  when:
    - ansible_facts.pkg_mgr in ['apt', 'dnf', 'dnf5']
    - not platform_has_rpm_ostree
    - platform_is_linux
  tags:
    - applications
    - vscode

- name: Configure and install 1Password
  ansible.builtin.import_tasks: one-password.yml
  when:
    - ansible_facts.pkg_mgr in ['apt', 'dnf', 'dnf5']
    - platform_is_linux
  tags:
    - applications
    - 1password

- name: Install Discord
  ansible.builtin.import_tasks: discord.yml
  when:
    - ansible_facts.pkg_mgr in ['apt', 'dnf', 'dnf5']
    - not platform_has_rpm_ostree
    - platform_is_linux
  tags:
    - applications
    - discord

- name: Install Equicord for Discord on Linux
  ansible.builtin.import_tasks: equicord.yml
  when: platform_is_linux
  tags:
    - applications
    - discord
    - equicord

- name: Install Ghostty
  ansible.builtin.import_tasks: ghostty.yml
  tags:
    - applications
    - ghostty

- name: Install native Helix tip build
  ansible.builtin.import_tasks: helix.yml
  when: platform_is_linux or platform_is_macos
  tags:
    - applications
    - helix

- name: Enable Vicinae on Linux
  ansible.builtin.import_tasks: vicinae.yml
  when: platform_is_linux
  tags:
    - applications
    - vicinae

- name: Load private application settings
  ansible.builtin.import_tasks: private-settings.yml
  tags:
    - applications
    - helium

- name: Install Helium on Linux
  ansible.builtin.import_tasks: helium.yml
  when: platform_is_linux
  tags:
    - applications
    - helium

- name: Apply managed application licenses on macOS
  ansible.builtin.import_tasks: licenses.yml
  when: platform_is_macos
  tags:
    - applications
    - alt-tab
    - macos
    - shottr

- name: Configure RustDesk on macOS
  ansible.builtin.import_tasks: rustdesk.yml
  when: platform_is_macos
  tags:
    - applications
    - macos
    - rustdesk

- name: Configure Equicord on macOS
  ansible.builtin.import_tasks: equicord.yml
  when: platform_is_macos
  tags:
    - applications
    - discord
    - equicord
    - macos

- name: Configure Helium on macOS
  ansible.builtin.import_tasks: helium.yml
  when: platform_is_macos
  tags:
    - applications
    - helium
    - macos
