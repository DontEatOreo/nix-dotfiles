---
- name: Keep Ghostty's macOS signing identity stable
  dotfiles_codesign:
    bundle: "{{ platform_homebrew_prefix }}/opt/ghostty-patched/Ghostty.app"
    identity: Kanata Local Code Signing
    keychain: /Library/Keychains/System.keychain
  become: true
  environment:
    PATH: "{{ platform_homebrew_path | default(dotfiles_path) }}"
  when: platform_is_macos

- name: Inspect the installed Ghostty application on macOS
  ansible.builtin.stat:
    path: /Applications/Ghostty.app
    follow: false
  register: applications_ghostty_installed
  when: platform_is_macos

- name: Remove the legacy Ghostty application symlink on macOS
  ansible.builtin.file:
    path: /Applications/Ghostty.app
    state: absent
  when:
    - platform_is_macos
    - applications_ghostty_installed.stat.islnk | default(false)

- name: Install a discoverable Ghostty application bundle on macOS
  ansible.posix.synchronize:
    src: "{{ platform_homebrew_prefix }}/opt/ghostty-patched/Ghostty.app/"
    dest: /Applications/Ghostty.app/
    archive: true
    checksum: true
    delete: true
    rsync_opts:
      - --xattrs
  register: applications_ghostty_bundle
  when: platform_is_macos

- name: Register Ghostty with Launch Services on macOS
  ansible.builtin.command:
    argv:
      - >-
        /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
      - -f
      - /Applications/Ghostty.app
  changed_when: false
  when:
    - platform_is_macos
    - applications_ghostty_bundle is changed

- name: Import Ghostty metadata into Spotlight on macOS
  ansible.builtin.command:
    argv:
      - /usr/bin/mdimport
      - -i
      - /Applications/Ghostty.app
  changed_when: false
  when:
    - platform_is_macos
    - applications_ghostty_bundle is changed
