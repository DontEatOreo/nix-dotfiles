---
- name: Resolve Equicord platform paths
  ansible.builtin.set_fact:
    applications_equicord_cli_asset: >-
      {{ 'EquilotlCli-darwin-arm64' if platform_is_macos else 'EquilotlCli-linux' }}
    applications_equicord_settings_dir: >-
      {{
        dotfiles_home_dir ~ '/Library/Application Support/Equicord/settings'
        if platform_is_macos
        else dotfiles_home_dir ~ '/.config/Equicord/settings'
      }}

- name: Require ARM64 macOS for Equilotl CLI
  ansible.builtin.assert:
    that:
      - platform_architecture == 'arm64'
    fail_msg: "This dotfiles Equicord macOS install path only supports ARM64 Macs."
  when: platform_is_macos

- name: Install latest Equilotl CLI
  ansible.builtin.import_tasks: github-release-asset.yml
  vars:
    applications_github_repository: Equicord/Equilotl
    applications_github_asset_name: "{{ applications_equicord_cli_asset }}"
    applications_github_asset_destination: >-
      {{ dotfiles_bin_dir }}/{{ applications_equicord_cli_asset }}
    applications_github_asset_mode: "0755"
    applications_github_asset_require_digest: false

- name: Configure the Equicord Linux launcher
  when: platform_is_linux
  block:
    - name: Ensure local applications directory exists
      ansible.builtin.file:
        path: "{{ dotfiles_home_dir }}/.local/share/applications"
        state: directory
        mode: "0755"

    - name: Install user Discord desktop entry through Equicord launcher
      ansible.builtin.copy:
        dest: "{{ dotfiles_home_dir }}/.local/share/applications/discord.desktop"
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=Discord
          StartupWMClass=discord
          Comment=All-in-one voice and text chat for gamers that's free, secure, and works on both your desktop and phone.
          GenericName=Internet Messenger
          Exec={{ dotfiles_bin_dir }}/discord-equicord --url -- %u
          Icon=discord
          Type=Application
          Categories=Network;InstantMessaging;
          MimeType=x-scheme-handler/discord;
          Path={{ dotfiles_home_dir }}

- name: Install latest Equicord desktop ASAR
  ansible.builtin.import_tasks: github-release-asset.yml
  vars:
    applications_github_repository: Equicord/Equicord
    applications_github_asset_name: desktop.asar
    applications_github_asset_destination: >-
      {{ dotfiles_home_dir }}/Library/Application Support/Equicord/equicord.asar
    applications_github_asset_mode: "0644"
    applications_github_asset_require_digest: true
  when: platform_is_macos

- name: Configure the Equicord macOS integration
  when: platform_is_macos
  block:
    - name: Inspect Discord ASAR files on macOS
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /Applications/Discord.app/Contents/Resources/app.asar
        - /Applications/Discord.app/Contents/Resources/_app.asar
      register: applications_equicord_asar_files

    - name: Read the current Discord ASAR loader on macOS
      ansible.builtin.slurp:
        src: /Applications/Discord.app/Contents/Resources/app.asar
      register: applications_equicord_loader
      when: applications_equicord_asar_files.results[0].stat.exists

    - name: Detect an existing Equicord ASAR loader on macOS
      ansible.builtin.set_fact:
        applications_equicord_is_patched: >-
          {{
            applications_equicord_asar_files.results[0].stat.exists
            and applications_equicord_asar_files.results[1].stat.exists
            and (
              'require("' ~ dotfiles_home_dir
              ~ '/Library/Application Support/Equicord/equicord.asar")'
            ) in (
              applications_equicord_loader.content
              | default('')
              | b64decode
            )
          }}

    - name: Patch an unmodified Discord installation with Equicord on macOS
      when: not applications_equicord_is_patched
      block:
        - name: Clear Discord ASAR immutable flags before first Equicord patch
          ansible.builtin.command:
            argv:
              - /usr/bin/chflags
              - nouchg
              - "{{ item.item }}"
          loop: "{{ applications_equicord_asar_files.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists
          become: true
          changed_when: false

        - name: Install Equicord into Discord on macOS
          ansible.builtin.command:
            argv:
              - "{{ dotfiles_bin_dir }}/{{ applications_equicord_cli_asset }}"
              - --install
              - --branch
              - stable
          environment:
            HOME: "{{ dotfiles_home_dir }}"
          changed_when: true
      always:
        - name: Inspect Discord ASAR files after Equicord patch
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /Applications/Discord.app/Contents/Resources/app.asar
            - /Applications/Discord.app/Contents/Resources/_app.asar
          register: applications_equicord_asar_files_after_patch

        - name: Lock Equicord macOS ASAR files against Discord updater overwrite
          ansible.builtin.command:
            argv:
              - /usr/bin/chflags
              - uchg
              - "{{ item.item }}"
          loop: "{{ applications_equicord_asar_files_after_patch.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists
          become: true
          changed_when: false

    - name: Inspect the final Equicord backup ASAR on macOS
      ansible.builtin.stat:
        path: /Applications/Discord.app/Contents/Resources/_app.asar
      register: applications_equicord_final_backup_asar

    - name: Read the final Equicord ASAR loader on macOS
      ansible.builtin.slurp:
        src: /Applications/Discord.app/Contents/Resources/app.asar
      register: applications_equicord_final_loader

    - name: Verify the final Equicord ASAR loader on macOS
      ansible.builtin.assert:
        that:
          - applications_equicord_final_backup_asar.stat.exists
          - >-
            (
              'require("' ~ dotfiles_home_dir
              ~ '/Library/Application Support/Equicord/equicord.asar")'
            ) in (
              applications_equicord_final_loader.content
              | b64decode
            )
        fail_msg: >-
          Discord is not patched with the expected Equicord ASAR loader.

- name: Ensure Equicord settings directory exists
  ansible.builtin.file:
    path: "{{ applications_equicord_settings_dir }}"
    state: directory
    mode: "0755"

- name: Generate Equicord plugin settings
  ansible.builtin.command:
    argv:
      - nix
      - eval
      - --json
      - .#lib.equicordSettingsJson
  args:
    chdir: "{{ dotfiles_repo_root }}"
  register: applications_equicord_settings
  changed_when: false

- name: Install generated Equicord plugin settings
  ansible.builtin.copy:
    content: "{{ applications_equicord_settings.stdout | from_json | to_nice_json }}\n"
    dest: "{{ applications_equicord_settings_dir }}/settings.json"
    mode: "0644"

- name: Render Equicord QuickCSS from the Black Rose Doll palette
  ansible.builtin.command:
    argv:
      - nix
      - eval
      - --json
      - path:.#lib.equicordQuickCss
  args:
    chdir: "{{ dotfiles_repo_root }}"
  register: applications_equicord_quick_css
  changed_when: false

- name: Install Equicord QuickCSS
  ansible.builtin.copy:
    content: "{{ applications_equicord_quick_css.stdout | from_json }}"
    dest: "{{ applications_equicord_settings_dir }}/quickCss.css"
    mode: "0644"
