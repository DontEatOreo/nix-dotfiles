---
- name: Configure 1Password on apt systems
  when: ansible_facts.pkg_mgr == 'apt'
  block:
    - name: Create 1Password apt key directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      become: true
      loop:
        - /usr/share/keyrings
        - /etc/debsig/policies/AC2D62742012EA22
        - /usr/share/debsig/keyrings/AC2D62742012EA22

    - name: Download 1Password signing key
      ansible.builtin.get_url:
        url: https://downloads.1password.com/linux/keys/1password.asc
        dest: "{{ dotfiles_cache_dir }}/1password.asc"
        mode: "0644"
      register: applications_onepassword_apt_key

    - name: Check 1Password debsig key
      ansible.builtin.stat:
        path: /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg
      register: applications_onepassword_debsig_key

    - name: Install 1Password debsig key when needed
      ansible.builtin.command:
        argv:
          - gpg
          - --dearmor
          - --yes
          - --output
          - /usr/share/debsig/keyrings/AC2D62742012EA22/debsig.gpg
          - "{{ dotfiles_cache_dir }}/1password.asc"
      become: true
      changed_when: true
      when: >-
        applications_onepassword_apt_key.changed
        or not applications_onepassword_debsig_key.stat.exists

    - name: Install 1Password debsig policy
      ansible.builtin.get_url:
        url: https://downloads.1password.com/linux/debian/debsig/1password.pol
        dest: /etc/debsig/policies/AC2D62742012EA22/1password.pol
        mode: "0644"
      become: true

    - name: Detect dpkg architecture
      ansible.builtin.command:
        argv:
          - dpkg
          - --print-architecture
      changed_when: false
      register: applications_dpkg_architecture

    - name: Add 1Password apt repository
      ansible.builtin.deb822_repository:
        name: 1password
        uris:
          - "https://downloads.1password.com/linux/debian/{{ applications_dpkg_architecture.stdout }}"
        suites:
          - stable
        components:
          - main
        architectures:
          - "{{ applications_dpkg_architecture.stdout }}"
        signed_by: https://downloads.1password.com/linux/keys/1password.asc
        install_python_debian: true
      become: true
      notify: Refresh apt cache

    - name: Apply pending apt repository cache refresh
      ansible.builtin.meta: flush_handlers

- name: Configure 1Password on dnf systems
  when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']
  block:
    - name: Install 1Password rpm signing key
      ansible.builtin.rpm_key:
        key: https://downloads.1password.com/linux/keys/1password.asc
        fingerprint: 3FEF9748469ADBE15DA7CA80AC2D62742012EA22
        state: present
      become: true

    - name: Add 1Password rpm repository
      ansible.builtin.yum_repository:
        name: 1password
        file: 1password
        description: 1Password Stable Channel
        baseurl: https://downloads.1password.com/linux/rpm/stable/$basearch
        enabled: true
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: https://downloads.1password.com/linux/keys/1password.asc
      become: true

- name: Install 1Password with the detected package manager
  ansible.builtin.package:
    name:
      - 1password
      - 1password-cli
    state: present
  become: true
  when: not platform_has_rpm_ostree
