---
- name: Check the Homebrew-managed Helium Linux payload
  ansible.builtin.stat:
    path: "{{ applications_helium_linux_app_dir }}/helium"
  register: applications_helium_linux_binary
  when: platform_is_linux

- name: Require Homebrew-managed Helium on Linux
  ansible.builtin.assert:
    that:
      - applications_helium_linux_binary.stat.executable | default(false)
    fail_msg: >-
      Helium is missing from Homebrew. Apply the Brewfile before configuring
      its user profile.
  when: platform_is_linux

- name: Detect a running Helium application
  ansible.builtin.command:
    argv:
      - /usr/bin/pgrep
      - -f
      - >-
        {{
          '^/Applications/Helium[.]app/'
          if platform_is_macos
          else '^' ~ applications_helium_linux_app_dir ~ '/helium([[:space:]]|$)'
        }}
  register: applications_helium_running
  changed_when: false
  failed_when: applications_helium_running.rc not in [0, 1]
  check_mode: false

- name: Report that Helium profile configuration is skipped
  ansible.builtin.debug:
    msg: Helium is running; skipping profile configuration.
  when:
    - applications_helium_running.rc == 0

- name: Configure the Helium profile
  ansible.builtin.import_tasks: helium-profile.yml
  vars:
    applications_helium_platform: "{{ 'macos' if platform_is_macos else 'linux' }}"
    applications_helium_root: "{{ dotfiles_cache_dir }}/helium"
    applications_helium_path: >-
      {{
        dotfiles_bin_dir ~ ':'
        ~ (
          platform_homebrew_path | default(dotfiles_path)
          if platform_is_macos
          else dotfiles_path
        )
      }}
    applications_helium_profile_dir: >-
      {{
        applications_helium_config.browser.paths[
          applications_helium_platform
        ].profile_dir
        | replace('${home}', dotfiles_home_dir)
        | replace('${config_home}', dotfiles_config_home)
        | replace('${data_home}', dotfiles_data_home)
      }}
  when: applications_helium_running.rc == 1
