---
- name: Detect GNOME support for Hyper window tiling
  ansible.builtin.command:
    argv:
      - gnome-extensions
      - version
  changed_when: false
  failed_when: false
  check_mode: false
  register: desktop_hyper_gnome_command

- name: Detect KDE support for Hyper window tiling
  ansible.builtin.command:
    argv:
      - plasmashell
      - --version
  changed_when: false
  failed_when: false
  check_mode: false
  register: desktop_hyper_kde_command

- name: Check KDE installation paths
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/share/plasma
    - /usr/share/wayland-sessions/plasma.desktop
  register: desktop_hyper_kde_paths

- name: Select available Hyper window tiling desktops
  ansible.builtin.set_fact:
    desktop_hyper_has_gnome: "{{ desktop_hyper_gnome_command.rc == 0 }}"
    desktop_hyper_has_kde: >-
      {{
        desktop_hyper_kde_command.rc == 0
        or desktop_hyper_kde_paths.results
          | selectattr('stat.exists')
          | list
          | length > 0
      }}

- name: Install Hyper window tiling build dependencies
  ansible.builtin.command:
    argv:
      - bun
      - install
      - --frozen-lockfile
    chdir: "{{ desktop_hyper_window_tiling_package }}"
  changed_when: false
  when: desktop_hyper_has_gnome or desktop_hyper_has_kde

- name: Build Hyper window tiling integrations
  ansible.builtin.command:
    argv:
      - bun
      - run
      - build
    chdir: "{{ desktop_hyper_window_tiling_package }}"
  changed_when: false
  when: desktop_hyper_has_gnome or desktop_hyper_has_kde

- name: Configure Hyper window tiling for GNOME
  ansible.builtin.import_tasks: window-tiling-gnome.yml
  when: desktop_hyper_has_gnome

- name: Configure Hyper window tiling for KDE
  ansible.builtin.import_tasks: window-tiling-kde.yml
  when: desktop_hyper_has_kde
