---
- name: Detect Flatpak
  ansible.builtin.command:
    argv:
      - flatpak
      - --version
  changed_when: false
  failed_when: false
  check_mode: false
  register: desktop_flatpak_command
  tags:
    - flatpak-nvidia

- name: Check system Flatpak installation
  ansible.builtin.stat:
    path: /var/lib/flatpak
  register: desktop_system_flatpak
  when: desktop_flatpak_command.rc == 0
  tags:
    - flatpak-nvidia
