---
- name: Detect GNOME settings support
  ansible.builtin.command:
    argv:
      - gsettings
      - --version
  changed_when: false
  failed_when: false
  check_mode: false
  register: desktop_gsettings_command
  tags:
    - workspace-shortcuts

- name: Configure supported GNOME settings
  ansible.builtin.import_tasks: settings-gnome.yml
  when: desktop_gsettings_command.rc == 0
