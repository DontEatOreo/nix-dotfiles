---
- name: Reconcile exact user NVIDIA Flatpak runtimes
  dotfiles_flatpak_nvidia:
    scope: user

- name: Reconcile exact system NVIDIA Flatpak runtimes
  dotfiles_flatpak_nvidia:
    scope: system
  become: "{{ not ansible_check_mode }}"
  when: desktop_system_flatpak.stat.isdir | default(false)
