---
- name: Check the image-provided Hyper KWin script
  ansible.builtin.stat:
    path: "{{ desktop_hyper_window_tiling_kwin_dir }}/contents/code/main.js"
  register: desktop_hyper_kwin_script

- name: Require the image-provided Hyper KWin script
  ansible.builtin.assert:
    that:
      - desktop_hyper_kwin_script.stat.isreg | default(false)
    fail_msg: >-
      Hyper window tiling is missing from the Spectrum image. Build and boot
      the current image before applying desktop configuration.

- name: Enable Hyper KWin script
  community.general.ini_file:
    path: "{{ dotfiles_config_home }}/kwinrc"
    section: Plugins
    option: hyper-window-tilingEnabled
    value: "true"
    no_extra_spaces: true
    mode: "0600"
  register: desktop_hyper_kwin_config

- name: Detect KDE D-Bus command
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - command -v qdbus6 || command -v qdbus
  changed_when: false
  failed_when: false
  check_mode: false
  register: desktop_hyper_qdbus

- name: Restart KWin scripting after Hyper script changes
  ansible.builtin.command:
    argv:
      - "{{ desktop_hyper_qdbus.stdout | trim }}"
      - org.kde.KWin
      - /Scripting
      - org.kde.kwin.Scripting.start
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - desktop_hyper_qdbus.rc == 0
    - desktop_hyper_kwin_config is changed
