---
- name: Check the image-provided Hyper GNOME extension
  ansible.builtin.stat:
    path: "{{ desktop_hyper_window_tiling_gnome_dir }}/extension.js"
  register: desktop_hyper_gnome_extension

- name: Require the image-provided Hyper GNOME extension
  ansible.builtin.assert:
    that:
      - desktop_hyper_gnome_extension.stat.isreg | default(false)
    fail_msg: >-
      Hyper window tiling is missing from the Spectrum image. Build and boot
      the current image before applying desktop configuration.

- name: List enabled GNOME extensions for Hyper
  ansible.builtin.command:
    argv:
      - gnome-extensions
      - list
      - --enabled
  changed_when: false
  check_mode: false
  register: desktop_hyper_gnome_enabled

- name: Enable the image-provided Hyper GNOME extension
  ansible.builtin.command:
    argv:
      - gnome-extensions
      - enable
      - "{{ desktop_hyper_window_tiling_uuid }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - desktop_hyper_window_tiling_uuid not in desktop_hyper_gnome_enabled.stdout_lines

- name: Configure Hyper GNOME extension shortcuts
  community.general.dconf:
    key: "/org/gnome/shell/extensions/hyper-window-tiling/{{ item.key }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ desktop_hyper_window_tiling_gnome_keys }}"
  loop_control:
    label: "{{ item.key }}"

- name: Free GNOME workspace navigation shortcuts for Hyper window tiling
  community.general.dconf:
    key: "/org/gnome/desktop/wm/keybindings/{{ item }}"
    value: "@as []"
    state: present
  loop:
    - switch-to-workspace-left
    - switch-to-workspace-right
    - move-to-workspace-left
    - move-to-workspace-right
