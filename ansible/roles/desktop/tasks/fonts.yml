---
- name: Require the image-provided JetBrainsMono Nerd Font Mono
  ansible.builtin.command:
    argv:
      - fc-match
      - --format=%{family[0]}
      - JetBrainsMono Nerd Font Mono
  changed_when: false
  failed_when: >-
    desktop_nerd_font_match.stdout | trim != 'JetBrainsMono Nerd Font Mono'
  check_mode: false
  register: desktop_nerd_font_match
  tags:
    - jetbrains-nerd-font

- name: Resolve the image-provided bitmap-backed Noto Color Emoji alias
  ansible.builtin.command:
    argv:
      - fc-match
      - --format=%{file}
      - Noto Color Emoji Bitmap
  changed_when: false
  check_mode: false
  register: desktop_color_emoji_verify
  tags:
    - color-emoji-font
    - font-cache

- name: Require the image-provided bitmap-backed Noto Color Emoji alias
  ansible.builtin.assert:
    that:
      - desktop_color_emoji_verify.stdout | trim == desktop_color_emoji_font_file
    fail_msg: >-
      The booted image does not provide the expected bitmap emoji font at
      {{ desktop_color_emoji_font_file }}. Fontconfig resolved the alias to
      {{ desktop_color_emoji_verify.stdout | trim | default('nothing', true) }}.
      Update and reboot into the current Spectrum image before applying host
      configuration.
  tags:
    - color-emoji-font
    - font-cache

- name: Detect writable GNOME font settings
  ansible.builtin.command:
    argv:
      - gsettings
      - writable
      - org.gnome.desktop.interface
      - "{{ item.key }}"
  loop: "{{ desktop_font_settings }}"
  loop_control:
    label: "{{ item.key }}"
  register: desktop_writable_font_settings
  changed_when: false
  failed_when: false
  check_mode: false

- name: Configure writable GNOME font settings
  community.general.dconf:
    key: "{{ item.item.path }}"
    value: "{{ item.item.value }}"
    state: present
  loop: "{{ desktop_writable_font_settings.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - item.rc == 0
    - item.stdout | trim == 'true'

- name: Check user fontconfig configuration
  ansible.builtin.stat:
    path: "{{ dotfiles_config_home }}/fontconfig/conf.d"
  register: desktop_user_fontconfig_directory
  tags:
    - font-cache

- name: Find user fontconfig fragments
  ansible.builtin.find:
    paths: "{{ dotfiles_config_home }}/fontconfig/conf.d"
    patterns: "*.conf"
    file_type: file
    recurse: false
  register: desktop_user_fontconfig_files
  when: desktop_user_fontconfig_directory.stat.isdir | default(false)
  tags:
    - font-cache

- name: Check Flatpak application data
  ansible.builtin.stat:
    path: "{{ dotfiles_home_dir }}/.var/app"
  register: desktop_flatpak_app_root
  tags:
    - font-cache

- name: Find Flatpak application directories
  ansible.builtin.find:
    paths: "{{ dotfiles_home_dir }}/.var/app"
    file_type: directory
    recurse: false
  register: desktop_flatpak_app_directories
  when: desktop_flatpak_app_root.stat.isdir | default(false)
  tags:
    - font-cache

- name: Reconcile Flatpak application font configuration
  ansible.builtin.include_tasks:
    file: flatpak-fonts.yml
    apply:
      tags:
        - host
        - fonts
        - font-cache
  loop: "{{ desktop_flatpak_app_directories.files | default([]) }}"
  loop_control:
    loop_var: desktop_flatpak_app
    label: "{{ desktop_flatpak_app.path | basename }}"
  tags:
    - font-cache
