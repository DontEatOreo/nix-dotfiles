---
- name: Record successful Sushi build
  ansible.builtin.copy:
    content: "{{ desktop_sushi_build_stamp_content }}"
    dest: "{{ desktop_sushi_build_stamp }}"
    mode: "0644"

- name: Stop running Sushi Flatpak process
  ansible.builtin.command:
    argv:
      - flatpak
      - kill
      - "{{ desktop_sushi_app_id }}"
  changed_when: false
  failed_when: false

- name: Stop Nautilus after Sushi rebuild
  ansible.builtin.command:
    argv:
      - nautilus
      - -q
  changed_when: false
  failed_when: false
