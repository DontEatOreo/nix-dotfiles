---
- name: Create Toshy state, source, and user unit directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ keyboard_toshy_render_dir }}"
      mode: "0700"
    - path: "{{ keyboard_toshy_automation_dir }}"
      mode: "0700"
    - path: "{{ keyboard_toshy_source_dir | dirname }}"
      mode: "0755"
    - path: "{{ keyboard_toshy_installed_revision | dirname }}"
      mode: "0755"
    - path: "{{ dotfiles_config_home }}/systemd/user/toshy-config.service.d"
      mode: "0755"

- name: Check out pinned Toshy source
  ansible.builtin.git:
    repo: "{{ keyboard_toshy_repository }}"
    dest: "{{ keyboard_toshy_source_dir }}"
    version: "{{ keyboard_toshy_revision }}"
    depth: 1
    force: true
  register: keyboard_toshy_source

- name: Install Toshy setup automation
  ansible.builtin.copy:
    src: "toshy/{{ item.src }}"
    dest: "{{ keyboard_toshy_automation_dir }}/{{ item.dest }}"
    mode: "0755"
  loop:
    - src: setup.py
      dest: setup.py
    - src: sudo-shim.py
      dest: sudo
  loop_control:
    label: "{{ item.dest }}"

- name: Check Toshy installation state
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - label: configuration
      path: "{{ keyboard_toshy_config }}"
    - label: installed revision
      path: "{{ keyboard_toshy_installed_revision }}"
    - label: Nix runtime revision
      path: "{{ keyboard_toshy_runtime_revision }}"
  loop_control:
    label: "{{ item.label }}"
  register: keyboard_toshy_state_files

- name: Select Toshy installation state
  ansible.builtin.set_fact:
    keyboard_toshy_config_file: "{{ keyboard_toshy_state_files.results[0] }}"
    keyboard_toshy_installed_revision_file: "{{ keyboard_toshy_state_files.results[1] }}"
    keyboard_toshy_runtime_revision_file: "{{ keyboard_toshy_state_files.results[2] }}"

- name: Read recorded Toshy revisions
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop:
    - label: installed revision
      path: "{{ keyboard_toshy_installed_revision }}"
      exists: "{{ keyboard_toshy_installed_revision_file.stat.exists | default(false) }}"
    - label: Nix runtime revision
      path: "{{ keyboard_toshy_runtime_revision }}"
      exists: "{{ keyboard_toshy_runtime_revision_file.stat.exists | default(false) }}"
  loop_control:
    label: "{{ item.label }}"
  when: item.exists | bool
  register: keyboard_toshy_revision_files

- name: Select recorded Toshy revisions
  ansible.builtin.set_fact:
    keyboard_toshy_installed_revision_value: >-
      {{
        keyboard_toshy_revision_files.results[0].content
        | default('')
        | b64decode
        | trim
      }}
    keyboard_toshy_runtime_revision_value: >-
      {{
        keyboard_toshy_revision_files.results[1].content
        | default('')
        | b64decode
        | trim
      }}

- name: Read the existing Toshy configuration
  ansible.builtin.slurp:
    src: "{{ keyboard_toshy_config }}"
  register: keyboard_toshy_existing_config
  when: keyboard_toshy_config_file.stat.exists | default(false)

- name: Require the pinned Toshy Nix runtime
  ansible.builtin.assert:
    that:
      - keyboard_toshy_runtime_revision_file.stat.exists | default(false)
      - keyboard_toshy_runtime_revision_value == keyboard_toshy_revision
    fail_msg: >-
      The active NixOS generation does not provide the pinned
      {{ keyboard_toshy_version }} runtime ({{ keyboard_toshy_revision }}).
      Rebuild and switch the NixOS configuration before provisioning Toshy's
      user files. Found runtime revision:
      {{ keyboard_toshy_runtime_revision_value | default('missing', true) }}.
  when: platform_is_nixos

- name: Decide whether Toshy user files need an upstream refresh
  ansible.builtin.set_fact:
    keyboard_toshy_install_required: >-
      {{
        keyboard_toshy_force_install | bool
        or keyboard_toshy_source is changed
        or not (keyboard_toshy_config_file.stat.exists | default(false))
        or keyboard_toshy_installed_revision_value != keyboard_toshy_revision
        or (
          keyboard_toshy_required_slice_markers
          | reject(
              'in',
              keyboard_toshy_existing_config.content
              | default('')
              | b64decode
            )
          | list
          | length > 0
        )
      }}
  vars:
    keyboard_toshy_required_slice_markers:
      - "SLICE_MARK_START: keymapper_api"
      - "SLICE_MARK_START: kbtype_override"
      - "SLICE_MARK_START: user_custom_functions"
      - "SLICE_MARK_START: barebones_user_cfg"

- name: Detect host sudo for the Toshy installer
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - command -v sudo
  changed_when: false
  failed_when: false
  check_mode: false
  register: keyboard_toshy_sudo
  when:
    - keyboard_toshy_install_required | bool
    - not platform_is_nixos

- name: Require non-interactive sudo for the standard Toshy installer
  ansible.builtin.assert:
    that:
      - keyboard_toshy_sudo.rc == 0
      - keyboard_toshy_sudo.stdout | trim | length > 0
    fail_msg: Toshy's standard installer requires sudo on non-NixOS hosts.
  when:
    - keyboard_toshy_install_required | bool
    - not platform_is_nixos

- name: Select the platform-specific Toshy installer path
  ansible.builtin.set_fact:
    keyboard_toshy_setup_python: >-
      {{
        keyboard_toshy_runtime_dir ~ '/bin/python'
        if platform_is_nixos
        else ansible_playbook_python
      }}
    keyboard_toshy_installer_args: >-
      {{
        ['install-user-files', '--barebones-config']
        if platform_is_nixos
        else (
          ['install', '--barebones-config']
          + (
              ['--override-distro', keyboard_toshy_distro_override]
              if keyboard_toshy_distro_override | length > 0
              else (
                ['--override-distro', 'silverblue']
                if platform_has_rpm_ostree
                else []
              )
            )
          + (['--skip-native'] if keyboard_toshy_skip_native else [])
          + (['--no-dbus-python'] if keyboard_toshy_no_dbus_python else [])
        )
      }}

- name: Refresh Toshy from the pinned upstream installer
  when:
    - not ansible_check_mode
    - keyboard_toshy_install_required | bool
  block:
    - name: Temporarily authorize the pinned Toshy installer
      ansible.builtin.copy:
        content: |
          {{ ansible_facts.user_id }} ALL=(ALL:ALL) NOPASSWD: ALL
        dest: /etc/sudoers.d/dotfiles-toshy-installer
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      become: true
      when: not platform_is_nixos

    - name: Run the pinned upstream Toshy installer
      ansible.builtin.command:
        argv: >-
          {{
            [
              keyboard_toshy_setup_python,
              keyboard_toshy_automation_dir ~ '/setup.py',
              keyboard_toshy_source_dir ~ '/setup_toshy.py'
            ] + keyboard_toshy_installer_args
          }}
      environment:
        PATH: >-
          {{
            keyboard_toshy_automation_dir
            ~ ':/run/wrappers/bin:/usr/sbin:/usr/bin:/sbin:/bin:'
            ~ '/usr/local/sbin:/usr/local/bin:' ~ dotfiles_path
          }}
        TOSHY_RUNTIME_DIR: >-
          {{ keyboard_toshy_runtime_dir if platform_is_nixos else '' }}
        TOSHY_SUDO: >-
          {{ keyboard_toshy_sudo.stdout | default('') | trim }}
        TOSHY_SUDO_SHIM_DIR: "{{ keyboard_toshy_automation_dir }}"
      changed_when: true

  always:
    - name: Remove the temporary Toshy installer authorization
      ansible.builtin.file:
        path: /etc/sudoers.d/dotfiles-toshy-installer
        state: absent
      become: true
      when: not platform_is_nixos

- name: Check Toshy configuration after installation
  ansible.builtin.stat:
    path: "{{ keyboard_toshy_config }}"
  register: keyboard_toshy_config_after_install

- name: Require Toshy configuration
  ansible.builtin.assert:
    that:
      - keyboard_toshy_config_after_install.stat.exists | default(false)
    fail_msg: >-
      Toshy {{ keyboard_toshy_version }} did not create the expected
      configuration at {{ keyboard_toshy_config }}.
  when: not ansible_check_mode

- name: Merge dotfiles slices into the pinned upstream configuration
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ role_path }}/files/toshy/merge-slices.py"
      - "{{ keyboard_toshy_config }}"
      - "{{ keyboard_toshy_slices }}"
      - "{{ keyboard_toshy_merged_config }}"
      - --upstream-config
      - "{{ keyboard_toshy_upstream_config }}"
      - --reset-slice
      - keymapper_api
  changed_when: false
  when:
    - not ansible_check_mode
    - keyboard_toshy_config_after_install.stat.exists | default(false)

- name: Validate merged Toshy configuration syntax
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - -m
      - py_compile
      - "{{ keyboard_toshy_merged_config }}"
  changed_when: false
  when:
    - not ansible_check_mode
    - keyboard_toshy_config_after_install.stat.exists | default(false)

- name: Install merged Toshy configuration
  ansible.builtin.copy:
    src: "{{ keyboard_toshy_merged_config }}"
    dest: "{{ keyboard_toshy_config }}"
    remote_src: true
    mode: "0644"
  notify: Restart Toshy services
  when:
    - not ansible_check_mode
    - keyboard_toshy_config_after_install.stat.exists | default(false)

- name: Record installed Toshy source revision
  ansible.builtin.copy:
    content: "{{ keyboard_toshy_revision }}\n"
    dest: "{{ keyboard_toshy_installed_revision }}"
    mode: "0644"
  when:
    - not ansible_check_mode
    - keyboard_toshy_config_after_install.stat.exists | default(false)

- name: Install Toshy Kanata user units
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: toshy-kanata.conf
      dest: >-
        {{ dotfiles_config_home }}/systemd/user/toshy-config.service.d/10-dotfiles.conf
    - src: >-
        toshy-kanata-device.path
      dest: "{{ dotfiles_config_home }}/systemd/user/toshy-kanata-device.path"
    - src: >-
        toshy-kanata-device.service
      dest: "{{ dotfiles_config_home }}/systemd/user/toshy-kanata-device.service"
  notify: Restart Toshy services

- name: Enable Toshy Kanata device watcher
  ansible.builtin.systemd_service:
    name: toshy-kanata-device.path
    enabled: true
    state: started
    scope: user
    daemon_reload: true

- name: Refresh Toshy for the current Kanata device
  ansible.builtin.systemd_service:
    name: toshy-kanata-device.service
    state: started
    scope: user
  changed_when: false
  failed_when: false

- name: Check Toshy desktop surfaces
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ dotfiles_data_home }}/applications/Toshy_Tray.desktop"
    - "{{ dotfiles_data_home }}/applications/app.toshy.preferences.desktop"
    - "{{ dotfiles_config_home }}/autostart/Toshy_Tray.desktop"
    - "{{ dotfiles_config_home }}/autostart/app.toshy.preferences.desktop"
  register: keyboard_toshy_desktop_surfaces

- name: Hide Toshy desktop surfaces
  community.general.ini_file:
    path: "{{ item.item }}"
    section: Desktop Entry
    option: NoDisplay
    value: "true"
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ keyboard_toshy_desktop_surfaces.results }}"
  loop_control:
    label: "{{ item.item | basename }}"
  when: item.stat.exists

- name: Disable Toshy tray user service
  ansible.builtin.systemd_service:
    name: toshy-tray.service
    enabled: false
    state: stopped
    scope: user
  failed_when: false
