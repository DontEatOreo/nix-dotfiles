---
- name: List image-provided GNOME extensions for Toshy
  ansible.builtin.command:
    argv:
      - gnome-extensions
      - list
      - --system
  changed_when: false
  check_mode: false
  register: keyboard_toshy_gnome_installed

- name: Require image-provided Toshy GNOME extensions
  ansible.builtin.assert:
    that:
      - item.uuid in keyboard_toshy_gnome_installed.stdout_lines
    fail_msg: >-
      {{ item.label }} is missing from the Spectrum image. Build and boot the
      current image before applying keyboard configuration.
  loop: "{{ keyboard_toshy_gnome_extensions }}"
  loop_control:
    label: "{{ item.label }}"

- name: List enabled GNOME extensions for Toshy
  ansible.builtin.command:
    argv:
      - gnome-extensions
      - list
      - --enabled
  changed_when: false
  check_mode: false
  register: keyboard_toshy_gnome_enabled

- name: Enable image-provided Toshy GNOME extensions
  ansible.builtin.command:
    argv:
      - gnome-extensions
      - enable
      - "{{ item.uuid }}"
  changed_when: true
  loop: "{{ keyboard_toshy_gnome_extensions }}"
  loop_control:
    label: "{{ item.label }}"
  when:
    - not ansible_check_mode
    - item.uuid not in keyboard_toshy_gnome_enabled.stdout_lines

- name: Read GNOME overlay key
  community.general.dconf:
    key: /org/gnome/mutter/overlay-key
    state: read
  register: keyboard_gnome_overlay_key

- name: Restore empty GNOME overlay key to Super
  community.general.dconf:
    key: /org/gnome/mutter/overlay-key
    value: "'Super_L'"
    state: present
  when:
    - keyboard_gnome_overlay_key is not skipped
    - keyboard_gnome_overlay_key.value | default("''") == "''"
