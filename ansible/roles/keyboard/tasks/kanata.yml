---
- name: Require image-provided Kanata integration
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/kanata
    - /usr/libexec/dotfiles/kanata/kanata.kbd
    - /usr/lib/udev/rules.d/70-dotfiles-uinput.rules
    - /usr/lib/modules-load.d/uinput.conf
    - /usr/lib/systemd/system/kanata-main.service
  register: keyboard_kanata_image_files

- name: Verify image-provided Kanata integration
  ansible.builtin.assert:
    that:
      - keyboard_kanata_image_files.results | map(attribute='stat.exists') | min
    fail_msg: >-
      Kanata host integration is missing from the Spectrum image. Build and
      boot the current image before applying keyboard configuration.

- name: Add host user to Kanata device groups
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    groups:
      - input
      - uinput
    append: true
  become: true

- name: Load the image-configured uinput kernel module now
  community.general.modprobe:
    name: uinput
    state: present
  become: true

- name: Validate installed Kanata configuration
  ansible.builtin.command:
    argv:
      - /usr/bin/kanata
      - --cfg
      - /usr/libexec/dotfiles/kanata/kanata.kbd
      - --check
      - --no-wait
  changed_when: false

- name: Gather service state for Kanata conflicts
  ansible.builtin.service_facts:

- name: Disable conflicting input-remapper service
  ansible.builtin.systemd_service:
    name: input-remapper.service
    enabled: false
    masked: true
    state: stopped
  become: true
  when:
    - not keyboard_keep_input_remapper | bool
    - "'input-remapper.service' in ansible_facts.services"

- name: Start the image-enabled Kanata system service
  ansible.builtin.systemd_service:
    name: kanata-main.service
    state: started
  become: true
