---
- name: Reset failed RustDesk Wayland dependencies
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - reset-failed
      - xdg-desktop-portal.service
      - xdg-desktop-portal-gnome.service
      - xdg-desktop-portal-gtk.service
      - pipewire.service
      - wireplumber.service
  changed_when: false
  failed_when: false
  environment:
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ system_rustdesk_runtime_dir }}/bus
    XDG_RUNTIME_DIR: "{{ system_rustdesk_runtime_dir }}"
  when: not ansible_check_mode

- name: Start RustDesk Wayland dependencies
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    state: started
  failed_when: false
  loop:
    - xdg-desktop-portal.service
    - pipewire.service
    - wireplumber.service
  loop_control:
    label: "{{ item }}"
  environment:
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ system_rustdesk_runtime_dir }}/bus
    XDG_RUNTIME_DIR: "{{ system_rustdesk_runtime_dir }}"

- name: Inspect RustDesk portal interfaces
  ansible.builtin.command:
    argv:
      - gdbus
      - introspect
      - --session
      - --dest
      - org.freedesktop.portal.Desktop
      - --object-path
      - /org/freedesktop/portal/desktop
  register: system_rustdesk_portal
  changed_when: false
  failed_when: false
  environment:
    DBUS_SESSION_BUS_ADDRESS: >-
      unix:path={{ system_rustdesk_runtime_dir }}/bus
    XDG_RUNTIME_DIR: "{{ system_rustdesk_runtime_dir }}"
  when:
    - system_rustdesk_tools.results[1].rc == 0
    - not ansible_check_mode

- name: Report unavailable RustDesk portal interfaces
  ansible.builtin.debug:
    msg: >-
      The desktop portal does not expose both ScreenCast and RemoteDesktop;
      RustDesk Wayland capture or input will fail. Check
      xdg-desktop-portal and the desktop-specific portal backend.
  when:
    - not ansible_check_mode
    - >-
      system_rustdesk_portal.rc | default(1) != 0
      or 'org.freedesktop.portal.ScreenCast'
      not in system_rustdesk_portal.stdout | default('')
      or 'org.freedesktop.portal.RemoteDesktop'
      not in system_rustdesk_portal.stdout | default('')

- name: Inspect the RustDesk PipeWire GStreamer source
  ansible.builtin.command:
    argv:
      - gst-inspect-1.0
      - pipewiresrc
  register: system_rustdesk_pipewire_plugin
  changed_when: false
  failed_when: false
  when:
    - system_rustdesk_tools.results[2].rc == 0
    - not ansible_check_mode

- name: Report an unavailable RustDesk PipeWire source
  ansible.builtin.debug:
    msg: >-
      GStreamer's pipewiresrc plugin is unavailable; install pipewire-gstreamer
      before using RustDesk as a Wayland controlled side.
  when:
    - not ansible_check_mode
    - system_rustdesk_pipewire_plugin.rc | default(1) != 0

- name: Inspect RustDesk Wayland session interfaces
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - path: >-
        {{ system_rustdesk_runtime_dir }}/bus
      socket: true
      message: >-
        Wayland session bus is unavailable; RustDesk portal capture will fail
        until the user session is healthy.
    - path: >-
        {{ system_rustdesk_runtime_dir }}/pipewire-0
      socket: true
      message: >-
        PipeWire socket is unavailable; RustDesk Wayland capture will fail.
    - path: /dev/uinput
      socket: false
      message: >-
        /dev/uinput is unavailable; RustDesk's Wayland input fallback will fail.
  register: system_rustdesk_wayland_interfaces

- name: Report unavailable RustDesk Wayland interfaces
  ansible.builtin.debug:
    msg: "{{ item.item.message }}"
  loop: "{{ system_rustdesk_wayland_interfaces.results | default([]) }}"
  when:
    - >-
      not item.stat.exists | default(false)
      or item.item.socket and not item.stat.issock | default(false)

- name: Inspect the active Wayland compositor socket
  ansible.builtin.find:
    paths: "{{ system_rustdesk_runtime_dir }}"
    patterns: wayland-*
    file_type: any
    recurse: false
    hidden: true
  register: system_rustdesk_wayland_socket
  failed_when: false

- name: Report an unavailable Wayland compositor socket
  ansible.builtin.debug:
    msg: >-
      No Wayland compositor socket is available; RustDesk cannot inspect the
      active display layout.
  when:
    - >-
      system_rustdesk_wayland_socket.files
      | default([])
      | selectattr('issock')
      | list
      | length == 0
