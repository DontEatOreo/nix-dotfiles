---
system_rustdesk_apparmor_enabled: true
system_rustdesk_wayland_environment: >-
  {{
    lookup('ansible.builtin.env', 'XDG_SESSION_TYPE') == 'wayland'
    or (lookup('ansible.builtin.env', 'WAYLAND_DISPLAY') | length > 0)
  }}
system_rustdesk_wayland_session: "{{ system_rustdesk_wayland_environment }}"
system_rustdesk_runtime_dir: >-
  {{
    lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR')
    | default('/run/user/' ~ ansible_facts.user_uid, true)
  }}
