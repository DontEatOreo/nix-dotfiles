---
bootstrap_homebrew_installer_url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
bootstrap_homebrew_repository: >-
  {{
    bootstrap_homebrew_prefix
    if platform_is_macos
    else bootstrap_homebrew_prefix ~ '/Homebrew'
  }}
bootstrap_homebrew_local_tap_dir: >-
  {{ bootstrap_homebrew_repository }}/Library/Taps/4evy/homebrew-dotfiles

bootstrap_bootstrap_packages:
  apt:
    - bubblewrap
    - curl
    - file
    - git
    - podman
    - podman-compose
    - procps
  apk:
    - bubblewrap
    - curl
    - file
    - git
    - podman
    - podman-compose
    - procps-ng
  dnf:
    - bubblewrap
    - curl
    - file
    - git
    - podman
    - podman-compose
    - procps-ng
  pacman:
    - bubblewrap
    - curl
    - file
    - git
    - podman
    - podman-compose
    - procps-ng

bootstrap_build_toolchain_packages:
  apt:
    - binutils
    - build-essential
    - clang
    - cmake
    - libclang-dev
    - libssl-dev
    - lld
    - lldb
    - patch
    - perl
    - pkg-config
    - zlib1g-dev
    - zig
  apk:
    - binutils
    - build-base
    - clang
    - cmake
    - linux-headers
    - lld
    - lldb
    - openssl-dev
    - patch
    - perl
    - pkgconf
    - zlib-dev
    - zig
  dnf:
    - binutils
    - clang
    - cmake
    - gcc
    - gcc-c++
    - glibc-devel
    - lld
    - lldb
    - make
    - openssl-devel
    - patch
    - perl
    - pkgconf-pkg-config
    - zlib-devel
    - zig
  pacman:
    - base-devel
    - binutils
    - clang
    - cmake
    - lld
    - lldb
    - openssl
    - patch
    - perl
    - pkgconf
    - zlib
    - zig
