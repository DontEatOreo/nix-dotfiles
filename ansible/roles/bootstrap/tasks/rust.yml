---
- name: Install Rustup components
  ansible.builtin.command:
    argv:
      - "{{ bootstrap_homebrew_prefix }}/bin/rustup"
      - toolchain
      - install
      - stable
      - --profile
      - default
      - --component
      - rustfmt
      - --component
      - clippy
      - --component
      - rust-analyzer
      - --component
      - rust-src
  environment:
    PATH: "{{ bootstrap_homebrew_path | default(dotfiles_path) }}"
  # rustup writes the toolchain result to stdout but component progress to
  # stderr. A missing component can therefore change an otherwise unchanged
  # toolchain, while a fully converged run reports only "up to date" on stderr.
  changed_when: >-
    'unchanged' not in bootstrap_rustup_toolchain.stdout or
    'downloading component' in bootstrap_rustup_toolchain.stderr or
    'installing component' in bootstrap_rustup_toolchain.stderr
  failed_when: bootstrap_rustup_toolchain.rc != 0
  register: bootstrap_rustup_toolchain
  tags:
    - bootstrap
    - rustup
