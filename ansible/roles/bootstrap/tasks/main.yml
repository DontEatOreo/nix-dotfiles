---
- name: Apply Homebrew bundle
  ansible.builtin.import_tasks: homebrew-bundle.yml
  when: platform_system in ['Darwin', 'Linux']
  tags:
    - bootstrap
    - homebrew

- name: Install repository Python commands early
  ansible.builtin.import_tasks: python-tool.yml
  when: platform_system in ['Darwin', 'Linux']
  tags:
    - bootstrap
    - repo-tools
    - scripts

- name: Install Rust
  ansible.builtin.import_tasks: rust.yml
  tags:
    - bootstrap
    - rustup
