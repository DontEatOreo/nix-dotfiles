- name: Ensure local dotfiles Homebrew tap root exists
  ansible.builtin.file:
    path: "{{ bootstrap_homebrew_local_tap_dir }}"
    state: directory
    mode: "0755"
  tags: &bootstrap_homebrew_tap_tags
    - alt-tab
    - ghostty
    - helix
    - jj
    - kanata
    - shottr
    - terminal-theme-tools

- name: Synchronize repository-owned local Homebrew tap content
  ansible.posix.synchronize:
    src: "{{ dotfiles_repo_root }}/"
    dest: "{{ bootstrap_homebrew_local_tap_dir }}/"
    archive: true
    checksum: true
    delete: true
    rsync_opts: >-
      {{
        bootstrap_homebrew_tap_rsync_common
        + (bootstrap_homebrew_tap_rsync_macos if platform_is_macos else [])
        + ['--exclude=*', '--delete-excluded', '--prune-empty-dirs']
      }}
  vars:
    bootstrap_homebrew_tap_rsync_common:
      - "--filter=protect_/Sources/***"
      - "--include=/Formula/***"
      - "--include=/npins/"
      - "--include=/npins/sources.json"
      - "--include=/packages/"
      - "--include=/packages/jj-patched/"
      - "--include=/packages/jj-patched/patches/***"
      - "--include=/packages/kanata-with-cmd/"
      - "--include=/packages/kanata-with-cmd/patches/***"
    bootstrap_homebrew_tap_rsync_macos:
      - "--include=/libexec/***"
      - "--include=/packages/ghostty-patched/"
      - "--include=/packages/ghostty-patched/patches/***"
      - "--include=/secrets/"
      - "--include=/secrets/secrets.yaml"
  tags: *bootstrap_homebrew_tap_tags

- name: Restrict encrypted local Homebrew tap data
  ansible.builtin.file:
    path: "{{ bootstrap_homebrew_local_tap_dir }}/secrets/secrets.yaml"
    state: file
    mode: "0600"
  when: platform_is_macos
  tags:
    - shottr

- name: Build terminal theme tools source archive for the local tap
  tags:
    - terminal-theme-tools
  block:
    - name: Ensure local Homebrew source archive cache exists
      ansible.builtin.file:
        path: "{{ dotfiles_cache_dir }}/homebrew-sources"
        state: directory
        mode: "0755"

    - name: Create deterministic terminal theme tools source archive
      ansible.builtin.command:
        argv:
          - /usr/bin/tar
          - -cf
          - "{{ dotfiles_cache_dir }}/homebrew-sources/terminal-theme-tools-0.3.0.tar"
          - -C
          - "{{ dotfiles_repo_root }}/packages/terminal-theme-tools"
          - build.zig
          - build.zig.zon
          - build_support.zig
          - README.md
          - config
          - include
          - src
          - tests
          - vendor
          - -C
          - "{{ dotfiles_repo_root }}"
          - LICENSE
      environment:
        COPYFILE_DISABLE: "1"
      changed_when: false

    - name: Synchronize generated local Homebrew source archives
      ansible.posix.synchronize:
        src: "{{ dotfiles_cache_dir }}/homebrew-sources/"
        dest: "{{ bootstrap_homebrew_local_tap_dir }}/Sources/"
        archive: true
        checksum: true
        delete: true

- name: Clear Discord cask ASAR locks before Homebrew changes
  ansible.builtin.command:
    argv:
      - chflags
      - nouchg
      - "{{ item }}"
  changed_when: false
  failed_when: false
  when:
    - platform_is_macos
    - not ansible_check_mode
  loop:
    - /Applications/Discord.app/Contents/Resources/app.asar
    - /Applications/Discord.app/Contents/Resources/_app.asar
  tags:
    - discord

- name: Inspect the Ghostty patched Cellar
  ansible.builtin.stat:
    path: "{{ bootstrap_homebrew_prefix }}/Cellar/ghostty-patched"
  register: bootstrap_ghostty_patched_cellar
  when: platform_is_macos
  tags:
    - ghostty

- name: Enumerate installed Ghostty patched kegs
  ansible.builtin.find:
    paths: "{{ bootstrap_homebrew_prefix }}/Cellar/ghostty-patched"
    file_type: directory
    recurse: false
  register: bootstrap_ghostty_patched_kegs
  when:
    - platform_is_macos
    - bootstrap_ghostty_patched_cellar.stat.isdir | default(false)
  tags:
    - ghostty

- name: Inspect installed Ghostty patched keg receipts
  ansible.builtin.stat:
    path: "{{ item.path }}/INSTALL_RECEIPT.json"
  loop: "{{ bootstrap_ghostty_patched_kegs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: bootstrap_ghostty_patched_receipts
  when: platform_is_macos
  tags:
    - ghostty

- name: Inspect the Ghostty patched Homebrew opt link
  ansible.builtin.stat:
    path: "{{ bootstrap_homebrew_prefix }}/opt/ghostty-patched"
    follow: false
  register: bootstrap_ghostty_patched_opt
  when: platform_is_macos
  tags:
    - ghostty

- name: Inspect the Ghostty patched opt link target receipt
  ansible.builtin.stat:
    path: "{{ bootstrap_ghostty_patched_opt.stat.lnk_source }}/INSTALL_RECEIPT.json"
  register: bootstrap_ghostty_patched_opt_receipt
  when:
    - platform_is_macos
    - bootstrap_ghostty_patched_opt.stat.islnk | default(false)
  tags:
    - ghostty

- name: Remove a Ghostty patched opt link to an incomplete keg
  ansible.builtin.file:
    path: "{{ bootstrap_homebrew_prefix }}/opt/ghostty-patched"
    state: absent
  when:
    - platform_is_macos
    - bootstrap_ghostty_patched_opt.stat.islnk | default(false)
    - not (bootstrap_ghostty_patched_opt_receipt.stat.exists | default(false))
  tags:
    - ghostty

- name: Remove incomplete Ghostty patched kegs
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ bootstrap_ghostty_patched_receipts.results | default([]) }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - platform_is_macos
    - not item.stat.exists
  tags:
    - ghostty

- name: Install privileged Homebrew cask
  community.general.homebrew_cask:
    name: temurin@21
    path: "{{ bootstrap_homebrew_prefix }}/bin"
    state: latest
    sudo_password: >-
      {{
        lookup('ansible.builtin.env', 'ANSIBLE_BECOME_PASS')
        or lookup('ansible.builtin.env', 'ANSIBLE_BECOME_PASSWORD')
      }}
  when: platform_is_macos
  tags:
    - temurin

- name: Apply Homebrew bundle
  ansible.builtin.command:
    argv:
      - "{{ bootstrap_homebrew_prefix }}/bin/brew"
      - bundle
      - install
      - --jobs
      - "1"
      - --force-cleanup
      - --file
      - "{{ dotfiles_repo_root }}/Brewfile"
  args:
    chdir: "{{ dotfiles_repo_root }}"
  environment:
    HOMEBREW_NO_ASK: "1"
    PATH: "{{ bootstrap_homebrew_path }}"
  register: bootstrap_homebrew_bundle_install
  changed_when: >-
    bootstrap_homebrew_bundle_install.stdout is search('(^|\n)(==> )?(Installing|Upgrading|Uninstalling|Uninstalled|Untapping|Removing) ')
    or bootstrap_homebrew_bundle_install.stderr is search('(^|\n)(==> )?(Installing|Upgrading|Uninstalling|Uninstalled|Untapping|Removing) ')

- name: Reconcile the installed terminal theme tools source
  ansible.builtin.import_tasks: homebrew-terminal-theme-tools.yml
  tags:
    - terminal-theme-tools
