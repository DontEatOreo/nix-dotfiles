---
- name: Check Nix root mountpoint
  ansible.builtin.stat:
    path: /nix
  register: tools_nix_root
  when: platform_has_rpm_ostree

- name: Gather root filesystem mount facts
  ansible.builtin.mount_facts:
    sources:
      - dynamic
    timeout: 10
  when: platform_has_rpm_ostree

- name: Require Nix mountpoint on composefs ostree hosts
  ansible.builtin.fail:
    msg: >-
      This ostree host uses composefs, so /nix must exist in the booted image
      before Determinate Nix can bind-mount it. Rebuild and boot the Spectrum
      image that includes the /nix mountpoint, then rerun this playbook without
      sudo after pre-authenticating with sudo -v.
  when:
    - platform_has_rpm_ostree
    - ansible_facts.mount_points.get('/', {}).get('fstype', '') == 'composefs'
    - not tools_nix_root.stat.exists | default(false)

- name: Ensure Nix installer cache directory exists
  ansible.builtin.file:
    path: "{{ dotfiles_cache_dir }}/installers"
    state: directory
    mode: "0755"

- name: Download Nix installer
  ansible.builtin.get_url:
    url: "{{ tools_nix_installer_url }}"
    dest: "{{ dotfiles_cache_dir }}/installers/nix-installer.sh"
    checksum: "{{ tools_nix_installer_checksum | default(omit) }}"
    mode: "0755"
  when: platform_is_linux

- name: Download signed Determinate Nix package
  ansible.builtin.get_url:
    url: "{{ tools_determinate_nix_pkg_url }}"
    dest: "{{ dotfiles_cache_dir }}/installers/Determinate.pkg"
    mode: "0644"
  when: platform_is_macos

- name: Validate Determinate Nix package signature
  ansible.builtin.command:
    argv:
      - /usr/sbin/spctl
      - -a
      - -vv
      - -t
      - install
      - "{{ dotfiles_cache_dir }}/installers/Determinate.pkg"
  changed_when: false
  failed_when: >-
    tools_determinate_nix_pkg_signature.rc != 0
    or ('(' ~ tools_determinate_nix_team_id ~ ')')
    not in tools_determinate_nix_pkg_signature.stderr
  register: tools_determinate_nix_pkg_signature
  when: platform_is_macos

- name: Install Determinate Nix on Linux
  ansible.builtin.command:
    argv:
      - /bin/sh
      - "{{ dotfiles_cache_dir }}/installers/nix-installer.sh"
      - install
      - "{{ 'ostree' if platform_has_rpm_ostree else 'linux' }}"
      - --no-confirm
      - --no-modify-profile
      - --determinate
  args:
    creates: "{{ tools_nix_bin }}"
  become: true
  environment:
    NIX_INSTALLER_NO_CONFIRM: "true"
  when: platform_is_linux

- name: Install signed Determinate Nix package on macOS
  ansible.builtin.command:
    argv:
      - /usr/sbin/installer
      - -verboseR
      - -pkg
      - "{{ dotfiles_cache_dir }}/installers/Determinate.pkg"
      - -tgt
      - /
  args:
    creates: "{{ tools_nix_bin }}"
  become: true
  when: platform_is_macos
