---
- name: Verify Homebrew-managed command binaries
  ansible.builtin.command:
    argv:
      - >-
        {{ tools_homebrew_prefix | default(platform_homebrew_prefix) }}/bin/{{ item }}
      - "--version"
  changed_when: false
  loop: "{{ tools_homebrew_commands }}"

- name: Verify uv-installed Python command binaries
  ansible.builtin.command:
    argv:
      - "{{ dotfiles_bin_dir }}/{{ item }}"
      - "--help"
  changed_when: false
  loop: "{{ tools_python_tools | default([]) }}"
